name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      controlled_live_checkout:
        description: 'Temporarily enable the unlinked Suspended checkout for live acceptance'
        type: boolean
        default: false
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release-check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.release.outputs.changed }}
    steps:
      - id: release
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'schedule') {
              core.setOutput('changed', 'true');
              return;
            }
            const { createHash } = require('node:crypto');
            const pointer = await fetch('https://downloads.studiocucurbits.com/releases/current.json', { cache: 'no-store', signal: AbortSignal.timeout(30000) });
            if (!pointer.ok && pointer.status !== 404) throw new Error(`Release pointer: ${pointer.status}`);
            const state = pointer.status === 404 ? 'unpublished' : createHash('sha256').update(await pointer.text()).digest('hex');
            const deployed = await fetch('https://www.studiocucurbits.com/download-state.json', { cache: 'no-store', signal: AbortSignal.timeout(30000) });
            if (!deployed.ok && deployed.status !== 404) throw new Error(`Deployed state: ${deployed.status}`);
            core.setOutput('changed', !deployed.ok || (await deployed.json()).state !== state ? 'true' : 'false');

  build:
    needs: release-check
    if: needs.release-check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      # Non-sensitive values live in repository variables. Every one is optional: an
      # unset value is read as an empty string, which the site treats exactly
      # like "not configured" and renders the safe fallback instead.
      ANALYTICS_PROVIDER: ${{ vars.ANALYTICS_PROVIDER }}
      LICENSING_API_BASE: ${{ vars.LICENSING_API_BASE }}
      ANALYTICS_ID: ${{ vars.ANALYTICS_ID }}
      SUSPENDED_DEMO_URL: ${{ vars.SUSPENDED_DEMO_URL }}
      SUSPENDED_MANUAL_URL: ${{ vars.SUSPENDED_MANUAL_URL }}
      # Only a manual acceptance run can activate the unlinked checkout page.
      PADDLE_CHECKOUT_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.controlled_live_checkout && 'live' || 'disabled' }}
      CONTROLLED_LIVE_CHECKOUT: ${{ github.event_name == 'workflow_dispatch' && inputs.controlled_live_checkout && 'true' || 'false' }}
      PADDLE_CLIENT_TOKEN: ${{ vars.PADDLE_CLIENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
